<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デベロッパー俳句スタンドアップトイ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-2 text-pink-300">デベロッパー俳句スタンドアップトイ</h1>
  <p class="text-center text-gray-500 text-sm mb-6">作業内容を入力→俳句に変換</p>
  <div class="bg-gray-900 rounded-xl p-5 mb-5">
    <textarea id="input" aria-label="作業内容入力" placeholder="例: バグ修正、テスト実装、コードレビュー対応、デプロイ準備..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white resize-none h-24 focus:outline-none focus:border-pink-500"></textarea>
    <div class="flex gap-2 mt-3">
      <button id="convertBtn" aria-label="俳句に変換" class="flex-1 bg-pink-600 hover:bg-pink-500 rounded-lg p-2 font-semibold transition">俳句に変換</button>
      <button id="regenBtn" aria-label="再生成" class="flex-1 bg-gray-700 hover:bg-gray-600 rounded-lg p-2 transition" disabled>再生成</button>
    </div>
  </div>
  <div id="haikuDisplay" class="bg-gray-900 rounded-xl p-6 mb-5 hidden">
    <div class="text-center">
      <div id="haikuText" class="text-2xl font-bold leading-relaxed text-pink-200 mb-4 whitespace-pre-line"></div>
      <div id="syllableInfo" class="text-sm text-gray-500 mb-3"></div>
      <button id="copyBtn" aria-label="コピー" class="bg-gray-700 hover:bg-gray-600 rounded-lg px-4 py-1 text-sm transition">📋 コピー</button>
    </div>
  </div>
  <div id="bookSection" class="bg-gray-900 rounded-xl p-5">
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-semibold text-gray-300">俳句帳 <span id="countBadge" class="text-xs bg-gray-700 px-2 py-0.5 rounded-full">0/20</span></h2>
      <button id="clearBook" aria-label="俳句帳をクリア" class="text-xs text-red-400 hover:text-red-300">クリア</button>
    </div>
    <div id="bookList" class="space-y-2 max-h-64 overflow-y-auto"></div>
  </div>
</div>
<script>
const templates5 = [
  ['バグ','修正','中','休','憩'],
  ['コード','書く','夜','更け','て'],
  ['デプロイ','待つ','間','の','沈黙'],
  ['テスト','通る','朝','の','光'],
  ['プル','リク','送る','指','震え'],
  ['マージ','完了','一','息','つく'],
  ['エラー','消えた','今','日も','終わる'],
  ['レビュー','待ち','コーヒー','冷め','て'],
];
const templates7 = [
  ['コミット','メッセージ','悩む','夜','また','また','また'],
  ['スタック','オーバー','フロー','見て','ため','息','つく'],
  ['ドキュメント','書く','気力','なく','また','明日','へ'],
  ['変数名','何に','しよう','と','考える','五分','過ぎ'],
  ['テスト','カバレッジ','百','パーセント','夢の','また','夢'],
  ['会議','資料','作る','合間','コード','書く','幸せ'],
];
const keywords = {
  'バグ': 2, '修正': 3, 'コード': 3, 'レビュー': 4, 'デプロイ': 4,
  'テスト': 3, 'マージ': 3, 'プル': 2, 'コミット': 4, 'エラー': 3,
  '実装': 3, 'リファクタ': 5, 'ドキュメント': 6, 'ミーティング': 6,
  '設計': 3, '調査': 3, 'CI': 2, 'CD': 2, 'PR': 2,
};

function countSyllables(word) {
  if (keywords[word]) return keywords[word];
  const vowels = word.match(/[aiueoあいうえおアイウエオ]/gi);
  return Math.max(1, vowels ? vowels.length : Math.ceil(word.length / 2));
}

function extractWords(text) {
  const found = [];
  Object.keys(keywords).forEach(k => { if (text.includes(k)) found.push(k); });
  if (found.length < 3) {
    const parts = text.split(/[,、。\s\n]+/).filter(p => p.length > 0);
    parts.forEach(p => { if (!found.includes(p)) found.push(p.substring(0, 6)); });
  }
  return found;
}

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateHaiku(text) {
  const words = extractWords(text);
  const t5a = pickRandom(templates5);
  const t7 = pickRandom(templates7);
  const t5b = pickRandom(templates5.filter(t => t !== t5a));
  let line1 = words[0] || t5a[0];
  let line2 = words[1] || t7[0];
  let line3 = words[2] || t5b[0];
  const filler5 = ['の夜', 'の朝', 'また今日', 'の果て', 'に祈る'];
  const filler7 = ['コードを書いて眠れない', 'バグに立ち向かう今日', 'デプロイ成功また明日'];
  const pad = (w, target) => {
    const s = countSyllables(w);
    if (s < target) return w + pickRandom(filler5).substring(0, Math.min(2, target - s));
    return w.substring(0, 4);
  };
  line1 = pad(line1, 5);
  line2 = pad(line2, 7);
  line3 = pad(line3, 5);
  return { line1, line2, line3 };
}

let currentHaiku = null;

function displayHaiku(h) {
  const text = `${h.line1}\n${h.line2}\n${h.line3}`;
  document.getElementById('haikuText').textContent = text;
  document.getElementById('syllableInfo').textContent = `五・七・五の彩り`;
  document.getElementById('haikuDisplay').classList.remove('hidden');
  currentHaiku = text;
}

function saveToBook(text) {
  const books = JSON.parse(localStorage.getItem('haikuBook') || '[]');
  if (books.includes(text)) return;
  books.unshift(text);
  if (books.length > 20) books.pop();
  localStorage.setItem('haikuBook', JSON.stringify(books));
  renderBook();
}

function renderBook() {
  const books = JSON.parse(localStorage.getItem('haikuBook') || '[]');
  document.getElementById('countBadge').textContent = `${books.length}/20`;
  document.getElementById('bookList').innerHTML = books.map((h, i) =>
    `<div class="bg-gray-800 rounded-lg p-2 text-sm text-gray-300 flex justify-between items-start">
      <span class="whitespace-pre-line">${h}</span>
      <span class="text-gray-600 text-xs ml-2">#${books.length - i}</span>
    </div>`
  ).join('');
}

document.getElementById('convertBtn').addEventListener('click', () => {
  const text = document.getElementById('input').value.trim();
  if (!text) return;
  const h = generateHaiku(text);
  displayHaiku(h);
  saveToBook(`${h.line1}\n${h.line2}\n${h.line3}`);
  document.getElementById('regenBtn').disabled = false;
});

document.getElementById('regenBtn').addEventListener('click', () => {
  const text = document.getElementById('input').value.trim();
  if (!text) return;
  const h = generateHaiku(text);
  displayHaiku(h);
  saveToBook(`${h.line1}\n${h.line2}\n${h.line3}`);
});

document.getElementById('copyBtn').addEventListener('click', () => {
  if (currentHaiku) navigator.clipboard.writeText(currentHaiku).catch(() => {});
  document.getElementById('copyBtn').textContent = '✅ コピー済み';
  setTimeout(() => { document.getElementById('copyBtn').textContent = '📋 コピー'; }, 1500);
});

document.getElementById('clearBook').addEventListener('click', () => {
  localStorage.removeItem('haikuBook');
  renderBook();
});

renderBook();
</script>
</body>
</html>
